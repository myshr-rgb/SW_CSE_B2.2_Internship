<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASIC INPUT TAG AND LABELS, BUTTONS</title>
</head>
<body>
    <form action="" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- second form  -->
    <br>
     <form action="" method="post">
        <label for="fullname">Enter fullname</label>
        <input type="text" name="fullname" id=""> <br>
        <label for="emailid">Enter Email id</label>
        <input type="email" name="emailid" id=""> <br>
        <label for="mypassword">Enter Password</label><br>
        <input type="password" name="mypassword" id=""><br>
        <label for="myage">Enter Age</label><br>
        <input type="number" name="myage" id="">
        <br>
        <textarea name="" id="" row="4" cols="30"></textarea>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
