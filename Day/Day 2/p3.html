<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered list</title>
</head>
<body>
    <p>Unordered List:list or a group of related items</p>
    <ul>
        <li>apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>

    <br>
    <p>Ordered List: list the items by numbering it </p>
    <ol>
        <li>Laptop</li>
        <li>Phone</li>
        <li>ipad</li>
        <li>Tablet </li>
        <li>Desktop</li>
    </ol>

</body>
</html>
