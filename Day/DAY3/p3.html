<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms 2</title>
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <p>
                <input type="text" name="fullname" id="fullname" placeholder="ENTER YOUR FULL NAME" minlength="2" maxlength="30" required>
            </p>
            <p>
                <input type="email" name="emailid" id="emailid" placeholder="ENTER YOUR EMAIL ID" required>
            </p>
            <p>
                <input type="password" name="mypassword" id="mypassword" placeholder="ENTER YOUR PASSWORD" required>
            </p>
            <p>
                <input type="number" name="myage" id="myage" placeholder="ENTER YOUR AGE" min="1" max="68" required> 
            </p>
            <p>
                <input type="tel" name="phone" id="phone" 
                pattern="[0-9]{10}"
                placeholder="ENTER YOUR PHONE NUMBER" pattern="[0-9]{10}" required>

            </p>
            <p> 
                <input type="date" id="dob" name="dob" required min="1999-01-01" max="2024-12-31">
            </p>
        </fieldset>

        <fieldset>
            <legend>Preferences</legend>
            <p>gender </p>
            <p>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>  
            </p>
            <p> 
            <P>skills: </p>
                <p> 
                    <input type="checkbox" name="skills" id="html" value="html">
                    <label for="html">HTML</label>  
                    <input type="checkbox" name="skills" id="css" value="css">
                    <label for="css">CSS</label> 
                    <input type="checkbox" name="skills" id="js" value="js">
                    <label for="js">JS</label>  
                    <input type="checkbox" name="skills" id="python" value="python">
                    <label for="python">Python</label>
                </p>
            <p>
                
                <label for="country">Select your country:</label>
                <select name="country" id="country">
                    <option value="india">India</option>
                    <option value="usa">USA</option>
                    <option value="uk">UK</option>
                    <option value="canada">Canada</option>
                </select>
            </p>
            <p>
                <label for="message">Message:</label><br>
                <textarea name="message" id="message" row="4" cols="30"></textarea>
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </p>
    </form>
</body>
</html>
