<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video tag</title>
</head>
<body>
    <p>video tag example</p>
    <video src="/SW_CSE_B2.2_Internship/Day/video/mp4videoWaudio.mp4" controls type="video/mp4">
    </video>

    <video src="/SW_CSE_B2.2_Internship/Day/video/sampleVideo (1).mp4" controls type="video/mp4" 
    width="650" height="400"
    ></video>

    <!-- autoplay -->
     <video src="" controls type="video/mp4" 
    width="650" height="400" autoplay
    ></video>
    <!-- video with audios -->
    <video src="/SW_CSE_B2.2_Internship/Day/video/mp4videoWaudio.mp4" controls autoplay muted width="650" height="400" ></video>
    
    
    <video src="/SW_CSE_B2.2_Internship/Day/video/sampleVideo (1).mp4" controls loop autoplay muted width="650" height="400" ></video>
</body>
</html>
